name: Update monthly GitHub commit candles

on:
  workflow_dispatch:
  schedule:
    - cron: "19 2 * * *"  # Daily at 02:19 UTC; scheduled runs can be delayed.
  push:
    paths:
      - "scripts/generate_candles.py"
      - ".github/workflows/candles.yml"

permissions:
  contents: write

concurrency:
  group: monthly-commit-chart
  cancel-in-progress: true

jobs:
  update-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render chart from GitHub-recognized commit contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/generate_candles.py

      - name: Commit updated chart if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/candles.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh monthly commit candles"
            git push
          fi
